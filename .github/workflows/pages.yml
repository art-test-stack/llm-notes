name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLICATION_DENYLIST_B64: ${{ secrets.PUBLICATION_DENYLIST_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print changed chapter metadata
        run: |
          python3 - <<'PY'
          import hashlib
          import html
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          path = Path("content/chapters/pytorch-data-loading.html")
          raw = path.read_text(encoding="utf-8")

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sections = 0
                  self.math_expressions = 0

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  classes = set((values.get("class") or "").split())
                  if tag == "h2":
                      self.sections += 1
                  if {"math-inline", "math-display"} & classes:
                      self.math_expressions += 1

          parser = Parser()
          parser.feed(raw)
          plain = " ".join(html.unescape(re.sub(r"<[^>]+>", " ", raw)).split())
          print("CHAPTER_SHA256=" + hashlib.sha256(raw.encode("utf-8")).hexdigest())
          print("CHAPTER_CHARACTERS=" + str(len(plain)))
          print("CHAPTER_SECTIONS=" + str(parser.sections))
          print("CHAPTER_MATH_EXPRESSIONS=" + str(parser.math_expressions))
          PY
      - name: Build and validate public site
        run: python3 scripts/validate_public.py
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
