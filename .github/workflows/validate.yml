name: Validate public site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUBLICATION_DENYLIST_B64: ${{ secrets.PUBLICATION_DENYLIST_B64 }}
      REQUIRE_PUBLICATION_DENYLIST: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check publication policy configuration
        run: python3 scripts/check_publication_policy.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned browser test dependency
        run: python3 -m pip install --disable-pip-version-check --no-input playwright==1.61.0
      - name: Validate privacy, content, math, links, and PWA structure
        run: python3 scripts/validate_public.py
      - name: Harden generated runtime assets
        run: python3 scripts/harden_site.py
      - name: Validate hardened runtime assets
        run: python3 scripts/validate_runtime.py
      - name: Run browser smoke test
        run: python3 scripts/smoke_browser.py
